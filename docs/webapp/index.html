<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>True Balance</title>
<meta name="description" content="Your next Max debit, your Leumi balance, and what you spent — read from your own accounts. Nothing is stored.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101A36" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">True Balance</h1>
  <p class="lead" id="lead"></p>

  <section id="choose">
    <div class="card pad bank-links">
      <div>
        <button class="full" id="link-max" type="button"></button>
        <p class="busy" id="max-busy" hidden></p>
      </div>
      <div>
        <button class="full" id="link-leumi" type="button"></button>
        <p class="busy" id="leumi-busy" hidden></p>
      </div>
    </div>
    <p class="note"><button class="plain" id="demo" type="button"></button></p>
  </section>

  <section id="dash" hidden></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

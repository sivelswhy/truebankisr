name: Build

# Commits that only touch docs or CI settings don't build (run the workflow
# by hand from the Actions tab if needed). Tags always build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "docs/**"
      - ".github/**"
      - "altstore-source.json"
      - ".gitignore"
      - ".env.example"
      - "ios/Local.xcconfig.example"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "docs/**"
      - ".github/**"
      - "altstore-source.json"
      - ".gitignore"
      - ".env.example"
      - "ios/Local.xcconfig.example"
  workflow_dispatch:

permissions:
  contents: write # to publish the IPA on tagged releases

# One build per branch or tag: a newer push cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On main, wait 10 minutes before building: a push in the meantime cancels
  # this run (concurrency above), so a burst of commits gives one build, of
  # the last one. Tags, pull requests and manual runs start at once.
  settle:
    name: Wait for more commits
    runs-on: ubuntu-latest
    steps:
      - name: Wait 10 minutes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 600

  web:
    name: Web app
    needs: settle
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1" # Chromium is only needed to scrape, not to build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  ios:
    name: iPhone app
    needs: settle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select the latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Core tests
        working-directory: ios/Packages/TrueBalanceCore
        run: swift test
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          cp Local.xcconfig.example Local.xcconfig # no signing team in CI
          xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project TrueBalance.xcodeproj -scheme TrueBalance -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build
      - name: Package the IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TrueBalance.app Payload/
          zip -qry TrueBalance.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: TrueBalance-ipa
          path: ios/TrueBalance.ipa
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "True Balance $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ios/TrueBalance.ipa --clobber
      # Every commit on main gets its own release, so the latest IPA is one tap away.
      - name: Release this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          git log -1 --format='%B' > notes.md
          gh release create "$tag" ios/TrueBalance.ipa --target "$GITHUB_SHA" \
            --title "True Balance build ${{ github.run_number }} (${GITHUB_SHA::7})" --notes-file notes.md --latest
      # AltStore / SideStore read this file to offer the new build as an update.
      - name: Update the AltStore source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node ios/altstore-source.mjs "1.0.$n" "$n" ios/TrueBalance.ipa \
              "https://github.com/${{ github.repository }}/releases/download/build-$n/TrueBalance.ipa" notes.md
            git add altstore-source.json
            git commit -qm "AltStore source: build $n [skip ci]"
            git push -q origin HEAD:main && break
          done
